# One-off helper: count Coursera's catalog (public catalog API + public
# sitemaps), deduplicating language-translated clones and relaunch variants.
# Runs only when this file itself changes (touch it to re-run); results are
# read from the job log.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Enumerate catalog, count, dedupe
        run: |
          python3 - <<'EOF'
          import json, re, time, urllib.request
          from collections import Counter

          UA = {'User-Agent': 'Mozilla/5.0 (compatible; catalog-count/1.0)'}

          def get(url, tries=5):
              for a in range(tries):
                  try:
                      return urllib.request.urlopen(
                          urllib.request.Request(url, headers=UA), timeout=90).read()
                  except Exception as e:
                      print('RETRY', a, url[:110], repr(e)); time.sleep(2 * (a + 1))
              raise SystemExit('GIVE_UP ' + url)

          # ---- enumerate the full catalog ---------------------------------
          BASE = 'https://api.coursera.org/api/courses.v1'
          FIELDS = 'slug,name,primaryLanguages,partnerIds,courseType'
          courses, start, total = {}, 0, None
          while True:
              d = json.loads(get(f'{BASE}?start={start}&limit=100&fields={FIELDS}'))
              for e in d.get('elements', []):
                  courses[e['id']] = e
              p = d.get('paging', {})
              total = p.get('total', total)
              nxt = p.get('next')
              if len(courses) % 5000 < 100:
                  print(f'fetched {len(courses)}...')
              if not nxt:
                  break
              start = int(nxt)
          print('API_PAGING_TOTAL =', total)
          print('ENUMERATED_ENTRIES =', len(courses))

          # ---- language mix (context) -------------------------------------
          langs = Counter(tuple(e.get('primaryLanguages') or ['?']) for e in courses.values())
          print('--- top primary languages ---')
          for k, v in langs.most_common(12):
              print('LANG', '/'.join(k), v)

          # ---- dedupe: collapse slug variants onto an existing base slug --
          # translated clones:  <base>-<lang>[-<region>]   (e.g. ...-pt-br)
          # relaunch variants:  <base>-<5-char hash>       (e.g. ...-i43mr)
          # Only collapsed when <base> itself exists as a slug, which keeps
          # legitimate slugs that merely end in a language-like token.
          LANG = ('ar|az|bg|bn|cs|da|de|el|es|et|fa|fi|fr|he|hi|hr|hu|id|it|ja|ka|kk|km|'
                  'ko|lt|lv|mn|ms|my|ne|nl|no|pl|pt|ro|ru|si|sk|sr|sv|sw|ta|te|th|tr|uk|'
                  'ur|uz|vi|zh')
          SUF = re.compile(r'-(?:' + LANG + r')(?:-[a-z0-9]{2,3})?$')
          HSH = re.compile(r'-[a-z0-9]{5}$')

          slugs = {e['slug'] for e in courses.values()}
          parent = {s: s for s in slugs}
          def find(x):
              while parent[x] != x:
                  parent[x] = parent[parent[x]]; x = parent[x]
              return x
          def union(a, b):
              ra, rb = find(a), find(b)
              if ra != rb: parent[ra] = rb

          n_lang = n_hash = 0
          for s in sorted(slugs):
              m = SUF.search(s)
              if m and s[:m.start()] in slugs:
                  union(s, s[:m.start()]); n_lang += 1; continue
              m = HSH.search(s)
              if m and s[:m.start()] in slugs:
                  union(s, s[:m.start()]); n_hash += 1

          clusters = Counter(find(s) for s in slugs)
          print('LANG_SUFFIX_CLONES_COLLAPSED =', n_lang)
          print('HASH_SUFFIX_VARIANTS_COLLAPSED =', n_hash)
          print('DEDUPED_COURSES_FULL_CATALOG =', len(clusters))
          print('--- 15 largest clusters (sanity check) ---')
          for base, n in clusters.most_common(15):
              print('CLUSTER', n, base)

          # ---- live subset: slugs with a public /learn/ page --------------
          xml = get('https://www.coursera.org/sitemap~www~courses.xml').decode('utf-8', 'ignore')
          live = set(re.findall(r'https://www\.coursera\.org/learn/([^/<\s]+)', xml))
          print('SITEMAP_LIVE_COURSE_PAGES =', len(live))
          live_roots = {find(s) for s in slugs if s in live}
          print('DEDUPED_LIVE_COURSES =', len(live_roots))
          only_api = len(slugs - live)
          print('API_ENTRIES_WITHOUT_LIVE_PAGE =', only_api)
          EOF
