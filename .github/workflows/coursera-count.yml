# One-off helper: capture Coursera's own search GraphQL request and replay it
# with facets to read the search index's product-type counts (the ~5k the
# site's filter dropdown shows). Runs when this file changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Replay site search with facets
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node - <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const p = await b.newPage();
            const reqBodies = [];
            p.on('request', r => {
              if (/graphql-gateway\?opname=Search/.test(r.url()) && reqBodies.length < 4) {
                const d = r.postData();
                if (d) reqBodies.push(d);
              }
            });
            await p.goto('https://www.coursera.org/search?query=', { waitUntil: 'domcontentloaded', timeout: 90000 });
            await p.waitForTimeout(10000);
            console.log('captured request bodies:', reqBodies.length);

            // find the PRODUCTS search op and use it as a template
            let template = null;
            for (const d of reqBodies) {
              try {
                const parsed = JSON.parse(d);
                const ops = Array.isArray(parsed) ? parsed : [parsed];
                for (const op of ops) {
                  if (JSON.stringify(op.variables || {}).includes('PRODUCTS')) { template = op; break; }
                }
              } catch (e) {}
              if (template) break;
            }
            if (!template) { console.log('NO_PRODUCTS_OP_FOUND'); for (const d of reqBodies) console.log('RAW_REQ', d.slice(0, 800)); await b.close(); return; }
            console.log('TEMPLATE_VARS', JSON.stringify(template.variables).slice(0, 1200));

            async function run(mutate, label) {
              const op = JSON.parse(JSON.stringify(template));
              const req = op.variables.requests ? op.variables.requests[0] : null;
              if (!req) { console.log('NO_REQUESTS_FIELD'); return; }
              mutate(req);
              const out = await p.evaluate(async body => {
                const r = await fetch('/graphql-gateway?opname=Search', {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body
                });
                return (await r.text()).slice(0, 5000);
              }, JSON.stringify([op]));
              console.log('=== ' + label + ' ===');
              console.log(out.replace(/\n/g, ' '));
            }

            await run(r => {
              r.query = '';
              r.limit = 1;
              r.facets = ['productTypeDescription', 'language'];
              r.maxValuesPerFacet = 60;
              r.facetFilters = [];
            }, 'ALL PRODUCTS, facet counts');

            await run(r => {
              r.query = '';
              r.limit = 1;
              r.facets = ['language'];
              r.maxValuesPerFacet = 60;
              r.facetFilters = [['productTypeDescription:Courses']];
            }, 'FILTER productTypeDescription=Courses');

            await b.close();
          })();
          EOF
