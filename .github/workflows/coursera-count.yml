# One-off helper: recalculate the Exec Ed + FutureLearn workbooks with
# LibreOffice, and enumerate FutureLearn's Premium course listing. Push all
# back. Runs when this file changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recalculate workbooks
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libreoffice-calc python3-openpyxl >/dev/null
          python3 tools/recalc.py research/edx-execed-prices.xlsx 180
          python3 tools/recalc.py research/futurelearn-course-prices.xlsx 240
      - name: Enumerate FutureLearn Premium courses
        run: |
          python3 - <<'EOF'
          import json, re, time, urllib.request

          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'}
          BASE = ('https://www.futurelearn.com/courses?filter_category=open'
                  '&filter_course_type=premium&filter_availability=started&page={}')
          slugs, pages = set(), 0
          for page in range(1, 41):
              try:
                  html = urllib.request.urlopen(
                      urllib.request.Request(BASE.format(page), headers=UA), timeout=60
                  ).read().decode('utf-8', 'ignore')
              except Exception as e:
                  print('PAGE_FAIL', page, repr(e))
                  break
              found = set(re.findall(r'href="/courses/([a-z0-9-]+)"', html))
              new = found - slugs
              print(f'page {page}: {len(found)} slugs, {len(new)} new')
              if not new:
                  break
              slugs |= new
              pages = page
              time.sleep(0.4)
          json.dump(sorted(slugs), open('research/futurelearn-premium-slugs.json', 'w'), indent=1)
          print('WROTE research/futurelearn-premium-slugs.json:', len(slugs), 'slugs from', pages, 'pages')
          EOF
      - name: Push results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/edx-execed-prices.xlsx research/futurelearn-course-prices.xlsx research/futurelearn-premium-slugs.json
          git commit -m "Recalculate Exec Ed + FutureLearn workbooks; add premium slug list" || echo "no changes"
          git push
