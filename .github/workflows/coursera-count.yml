# One-off helper: harvest Coursera prices — VerifiedCertificate price for
# every course via productPrices.v3, ProfCert per-month prices from pages,
# MasterTrack/Graduate Certificate tuition. Push harvest JSON back.
# Runs when this file changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Harvest Coursera prices
        run: |
          python3 - <<'EOF'
          import json, re, time, urllib.request
          from concurrent.futures import ThreadPoolExecutor

          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'}

          def get(url, tries=3):
              for a in range(tries):
                  try:
                      return urllib.request.urlopen(
                          urllib.request.Request(url, headers=UA), timeout=60).read().decode('utf-8', 'ignore')
                  except Exception as e:
                      err = e; time.sleep(1 + a)
              return None

          # ---- 1. enumerate all courses ----------------------------------
          courses, start = {}, 0
          while True:
              d = json.loads(get(f'https://api.coursera.org/api/courses.v1?start={start}&limit=100&fields=slug,name'))
              for e in d.get('elements', []):
                  courses[e['id']] = {'slug': e['slug'], 'name': e.get('name', '')}
              nxt = d.get('paging', {}).get('next')
              if not nxt: break
              start = int(nxt)
          ids = list(courses)
          print('courses enumerated:', len(ids))

          # ---- 2. price sweep (multi-get if supported) --------------------
          def batch_url(batch):
              q = ','.join(f'VerifiedCertificate~{i}~USD~US' for i in batch)
              return f'https://www.coursera.org/api/productPrices.v3?ids={q}'

          test = get(batch_url(ids[:5]))
          multiget = test is not None and '"amount"' in (test or '')
          print('multi-get supported:', multiget)

          prices = {}
          if multiget:
              BATCH = 50
              batches = [ids[i:i+BATCH] for i in range(0, len(ids), BATCH)]
              def fetch_batch(b):
                  t = get(batch_url(b), tries=2)
                  if not t: return []
                  try:
                      return json.loads(t).get('elements', [])
                  except Exception:
                      return []
              with ThreadPoolExecutor(max_workers=6) as ex:
                  for i, els in enumerate(ex.map(fetch_batch, batches)):
                      for el in els:
                          pid = el.get('productItemId')
                          if pid:
                              prices[pid] = {'amount': el.get('amount'),
                                             'promo': bool((el.get('promotionInfo') or {}).get('promotionId'))}
                      if (i + 1) % 50 == 0:
                          print('batches', i + 1, 'of', len(batches), '| prices:', len(prices))
          else:
              import random
              random.seed(11)
              sample = random.sample(ids, 2500)
              def fetch_one(cid):
                  t = get(f'https://www.coursera.org/api/productPrices.v3/VerifiedCertificate~{cid}~USD~US', tries=2)
                  if not t: return None
                  try:
                      el = json.loads(t)['elements'][0]
                      return (cid, {'amount': el.get('amount'),
                                    'promo': bool((el.get('promotionInfo') or {}).get('promotionId'))})
                  except Exception:
                      return None
              with ThreadPoolExecutor(max_workers=8) as ex:
                  for r in ex.map(fetch_one, sample):
                      if r: prices[r[0]] = r[1]
              print('sampled prices:', len(prices))
          print('TOTAL PRICES:', len(prices))

          # ---- 3. specialization price API variants -----------------------
          d = json.loads(get('https://api.coursera.org/api/courses.v1?limit=40&fields=s12nIds'))
          sids = [s for c in d.get('elements', []) for s in (c.get('s12nIds') or [])][:3]
          spec_probe = []
          for sid in sids:
              for pat in ['Specialization', 'SpecializationV2', 'S12nMembership']:
                  u = f'https://www.coursera.org/api/productPrices.v3/{pat}~{sid}~USD~US'
                  t = get(u, tries=1)
                  spec_probe.append({'url': u, 'ok': bool(t and '"amount"' in t), 'body': (t or 'ERR')[:150]})

          # ---- 4. page crawls: profcerts, mastertrack, certificates -------
          def tuition_page(u):
              html = get(u, tries=2)
              if not html:
                  return {'url': u, 'error': 'fetch failed'}
              title = (re.search(r'<title>([^<]*)</title>', html) or [None, ''])[1]
              tuition = re.findall(r'"tuition(?:Caption)?"\s*:\s*"([^"]{1,120})"', html)
              monthly = re.findall(r'\$\s?(\d{2,3})\s*(?:USD\s*)?(?:per month|/month|a month)', html)
              dollars = re.findall(r'\$\s?([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?)', html)
              return {'url': u, 'title': title.strip()[:110],
                      'tuition': list(dict.fromkeys(tuition))[:4],
                      'monthly': list(dict.fromkeys(monthly))[:4],
                      'dollars': list(dict.fromkeys(dollars))[:8]}

          out_pages = {}
          for name, sm, keep in [
              ('profcerts', 'https://www.coursera.org/sitemap~www~certificates.xml', '/professional-certificates/'),
              ('gradcerts', 'https://www.coursera.org/sitemap~www~certificates.xml', '/certificates/'),
              ('mastertrack', 'https://www.coursera.org/sitemap~www~mastertrack.xml', '')]:
              xml = get(sm) or ''
              urls = [u for u in re.findall(r'<loc>\s*([^<\s]+)\s*</loc>', xml)
                      if (keep in u if keep else True)]
              if name == 'gradcerts':
                  urls = [u for u in urls if '/professional-certificates/' not in u]
              print(name, 'pages:', len(urls))
              res = []
              with ThreadPoolExecutor(max_workers=5) as ex:
                  for r in ex.map(tuition_page, urls):
                      res.append(r)
              out_pages[name] = res

          harvest = {
              'courses': {cid: {**courses.get(cid, {}), **p} for cid, p in prices.items()},
              'multiget': multiget,
              'spec_probe': spec_probe,
              **out_pages,
          }
          json.dump(harvest, open('research/coursera-price-harvest.json', 'w'))
          print('WROTE research/coursera-price-harvest.json')
          EOF
      - name: Push results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/coursera-price-harvest.json
          git commit -m "Add Coursera price harvest" || echo "no changes"
          git push
