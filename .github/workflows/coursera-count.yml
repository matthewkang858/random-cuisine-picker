# One-off helper: (1) crawl all edX XSeries program pages for prices and
# bundle discounts; (2) try an Ed2Go partner storefront on a college domain
# (ed2go.com itself 403s datacenter IPs). Runs when this file changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: XSeries prices + Ed2Go partner storefront
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node - <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',
              viewport: { width: 1366, height: 900 }
            });
            const p = await ctx.newPage();

            async function goText(url, wait = 3000) {
              const resp = await p.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await p.waitForTimeout(wait);
              return { status: resp ? resp.status() : 0, title: await p.title() };
            }

            /* ---------- 1. edX XSeries sweep ---------- */
            console.log('===== EDX XSERIES =====');
            let xsUrls = new Set();
            try {
              await goText('https://www.edx.org/sitemap.xml', 1500);
              let content = await p.content();
              const subs = [...content.matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/g)].map(m => m[1]);
              const isIndex = content.includes('<sitemapindex');
              const pool = isIndex ? subs : [];
              subs.filter(u => u.includes('/xseries/')).forEach(u => xsUrls.add(u));
              for (const s of pool) {
                if (xsUrls.size > 200) break;
                try {
                  await goText(s, 800);
                  content = await p.content();
                  [...content.matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/g)]
                    .map(m => m[1]).filter(u => u.includes('/xseries/'))
                    .forEach(u => xsUrls.add(u));
                } catch (e) {}
              }
            } catch (e) { console.log('SITEMAP_FAIL', String(e).slice(0, 120)); }
            xsUrls = [...xsUrls].filter(u => !u.endsWith('/xseries') && !u.endsWith('/xseries/'));
            console.log('XSERIES_URLS_FOUND =', xsUrls.length);

            const results = [];
            for (const u of xsUrls.slice(0, 70)) {
              try {
                const { status, title } = await goText(u, 2500);
                if (status >= 400) { console.log('XS_ERR', status, u); continue; }
                const data = await p.evaluate(() => {
                  const out = { ld: [], lines: [], nCourses: null };
                  document.querySelectorAll('script[type="application/ld+json"]').forEach(s => {
                    try {
                      const j = JSON.parse(s.textContent);
                      JSON.stringify(j).replace(/"price"\s*:\s*"?([0-9.]+)/g, (_, v) => { out.ld.push(+v); return _; });
                    } catch (e) {}
                  });
                  const txt = document.body.innerText;
                  const mC = txt.match(/(\d+)\s+(?:high-quality\s+)?courses?\s+in\s+this/i) || txt.match(/Courses in this program[\s\S]{0,40}?(\d+)/i);
                  if (mC) out.nCourses = +mC[1];
                  for (const line of txt.split('\n')) {
                    const t = line.trim();
                    if (t.length < 220 && /\$\s?[0-9]/.test(t) &&
                        /full program|save|% off|original|price|total|discount/i.test(t)) out.lines.push(t);
                  }
                  const anyDollar = txt.match(/\$\s?[0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?/g) || [];
                  out.lines.push('AMOUNTS: ' + [...new Set(anyDollar)].slice(0, 8).join(' '));
                  return out;
                });
                const slug = u.split('/xseries/')[1];
                console.log('XS', slug, '| LD:', data.ld.join(','), '| courses:', data.nCourses,
                            '|', data.lines.slice(0, 4).join(' || ').slice(0, 260));
                results.push({ slug, ld: data.ld });
              } catch (e) { console.log('XS_FAIL', u, String(e).slice(0, 100)); }
            }
            const prices = results.map(r => Math.max(...r.ld.filter(v => v > 20), 0)).filter(v => v > 0).sort((a, b) => a - b);
            if (prices.length) {
              const med = prices[Math.floor(prices.length / 2)];
              console.log(`XSERIES_STATS n=${prices.length} min=${prices[0]} median=${med} max=${prices[prices.length - 1]}`);
            }

            /* ---------- 2. Ed2Go partner storefront (college domain) ---------- */
            console.log('\n===== ED2GO PARTNER STOREFRONT (careertraining.sdsu.edu) =====');
            for (const [url, label] of [
              ['https://careertraining.sdsu.edu/', 'home'],
              ['https://careertraining.sdsu.edu/training-programs/', 'programs index'],
              ['https://careertraining.sdsu.edu/healthcare-fitness/', 'healthcare category'],
              ['https://careertraining.sdsu.edu/information-technology/', 'IT category']
            ]) {
              try {
                const { status, title } = await goText(url, 3500);
                console.log(`\n### ${label} | HTTP ${status} | ${title.slice(0, 70)}`);
                if (status >= 400 || /access denied/i.test(title)) { console.log('BLOCKED'); continue; }
                const cards = await p.evaluate(() => {
                  const out = new Set();
                  document.querySelectorAll('a, div, li, article').forEach(el => {
                    const t = (el.innerText || '').trim().replace(/\s+/g, ' ');
                    if (t && t.length < 160 && /\$\s?[0-9]{2,}/.test(t)) out.add(t.slice(0, 140));
                  });
                  return [...out].slice(0, 50);
                });
                cards.forEach(c => console.log('CARD', c));
              } catch (e) { console.log(label, 'FAILED', String(e).slice(0, 100)); }
            }
            await b.close();
          })();
          EOF
