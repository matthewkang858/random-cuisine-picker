# One-off helper: second-pass crawl of edX executive-education PROGRAM pages
# (from the pass-1 JSON already on this branch) with scrolling and longer
# waits, extracting fee text and embedded price JSON. Runs when this file
# changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Deep-crawl exec-ed program pages
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node - <<'EOF'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const pass1 = JSON.parse(fs.readFileSync('research/edx-execed-crawl.json', 'utf8'));
            const slugs = pass1.map(r => r.slug).filter(s => (s.match(/-/g) || []).length >= 3);
            console.log('program slugs to crawl:', slugs.length);

            const b = await chromium.launch();
            const ctx = await b.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',
              viewport: { width: 1366, height: 900 }
            });
            const p = await ctx.newPage();

            const out = [];
            let done = 0;
            for (const slug of slugs) {
              const u = 'https://www.edx.org/executive-education/' + slug;
              try {
                const resp = await p.goto(u, { waitUntil: 'domcontentloaded', timeout: 60000 });
                if (resp && resp.status() >= 400) { console.log('ERR', resp.status(), slug); continue; }
                await p.waitForTimeout(2500);
                for (let s = 0; s < 3; s++) {                  // lazy sections load on scroll
                  await p.evaluate(() => window.scrollBy(0, document.body.scrollHeight / 3));
                  await p.waitForTimeout(1200);
                }
                const data = await p.evaluate(() => {
                  const r = { title: document.title, weeks: null, feeLines: [], srcPrices: [], amounts: [] };
                  const txt = document.body.innerText;
                  const mW = txt.match(/(\d+)\s+weeks?/i);
                  if (mW) r.weeks = +mW[1];
                  for (const m of txt.matchAll(/[^\n]{0,70}(?:fee|price|total|cost|payment|installment)[^\n]{0,70}/gi)) {
                    const t = m[0].trim();
                    if (/\$\s?\d|USD\s?\d/.test(t)) r.feeLines.push(t.slice(0, 150));
                  }
                  r.feeLines = [...new Set(r.feeLines)].slice(0, 8);
                  const src = document.documentElement.outerHTML;
                  for (const m of src.matchAll(/"(?:price|amount|fee|programFee|totalPrice|full_price|display_price)[^"]{0,20}"\s*:\s*"?\$?\s?([0-9][0-9,]{2,}(?:\.[0-9]{1,2})?)"?/gi)) {
                    r.srcPrices.push(m[1]);
                  }
                  r.srcPrices = [...new Set(r.srcPrices)].slice(0, 10);
                  r.amounts = [...new Set((txt.match(/\$\s?[0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?/g) || [])
                    .map(a => a.replace(/[$\s]/g, '')))].slice(0, 10);
                  return r;
                });
                out.push({ slug, ...data });
                if (++done % 20 === 0) console.log('crawled', done, 'of', slugs.length);
              } catch (e) { console.log('FAIL', slug, String(e).slice(0, 80)); }
            }
            fs.writeFileSync('research/edx-execed-crawl2.json', JSON.stringify(out, null, 1));
            console.log('WROTE research/edx-execed-crawl2.json with', out.length, 'programs');
            await b.close();
          })();
          EOF
      - name: Push results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/edx-execed-crawl2.json
          git commit -m "Add exec-ed deep-crawl results (pass 2)" || echo "no changes"
          git push
