# One-off helper: crawl Ed2Go's public catalog to extract real course prices
# (fundamentals courses + career training programs) and print a price
# distribution. Runs when this file changes; results read from the job log.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Crawl Ed2Go catalog prices
        run: |
          python3 - <<'EOF'
          import gzip, json, random, re, statistics, time, urllib.request
          from collections import Counter

          UA = {'User-Agent': 'Mozilla/5.0 (compatible; price-research/1.0)'}

          def fetch(url, tries=3):
              for a in range(tries):
                  try:
                      raw = urllib.request.urlopen(
                          urllib.request.Request(url, headers=UA), timeout=60).read()
                      if raw[:2] == b'\x1f\x8b':
                          raw = gzip.decompress(raw)
                      return raw.decode('utf-8', 'ignore')
                  except Exception as e:
                      err = e; time.sleep(1 + a)
              print('FETCH_FAIL', url[:120], repr(err))
              return ''

          def locs(xml):
              return re.findall(r'<loc>\s*([^<\s]+)\s*</loc>', xml)

          def discover(host):
              urls = []
              robots = fetch(f'https://{host}/robots.txt')
              maps = re.findall(r'(?i)sitemap:\s*(\S+)', robots)
              if not maps:
                  maps = [f'https://{host}/sitemap.xml']
              seen = set(maps); queue = list(maps)
              while queue:
                  m = queue.pop(0)
                  xml = fetch(m)
                  if '<sitemapindex' in xml:
                      for s in locs(xml):
                          if s not in seen:
                              seen.add(s); queue.append(s)
                  else:
                      urls.extend(locs(xml))
              return urls

          def families(urls, host):
              fam = Counter()
              for u in urls:
                  m = re.match(rf'https?://{re.escape(host)}/([^/]*)/?([^/]*)', u)
                  if m: fam['/' + m.group(1) + ('/' + m.group(2) if m.group(2) else '')] += 1
              return fam

          def extract_price(html):
              # JSON-LD offers first, visible $ amounts as fallback
              ld = re.findall(r'"price"\s*:\s*"?([0-9][0-9,]*(?:\.[0-9]{1,2})?)', html)
              vis = re.findall(r'\$\s?([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?)\s*(?:\(USD\)|USD\b)?', html)
              ldv = [float(x.replace(',', '')) for x in ld]
              visv = [float(x.replace(',', '')) for x in vis]
              cand = [v for v in ldv if v >= 40] or [v for v in visv if v >= 40]
              return max(cand) if cand else None, sorted(set(ldv + visv))[:8]

          random.seed(7)
          for host, label, want in [('www.ed2go.com', 'fundamentals+ctp', 200),
                                    ('careertraining.ed2go.com', 'career-training', 120)]:
              print(f'===== {host} =====')
              urls = discover(host)
              print('sitemap urls:', len(urls))
              fam = families(urls, host)
              for k, v in fam.most_common(15):
                  print('FAMILY', v, k)
              course_urls = [u for u in urls if re.search(r'/(courses?|ctp|programs?|training-programs?)/', u)]
              print('course-like urls:', len(course_urls))
              sample = random.sample(course_urls, min(want, len(course_urls)))
              prices = {'ilc_self': [], 'ctp': []}
              shown = 0
              for u in sample:
                  html = fetch(u, tries=2)
                  if not html: continue
                  price, all_seen = extract_price(html)
                  if price is None: continue
                  kind = 'ctp' if ('/ctp/' in u or 'careertraining' in u or price >= 900
                                   or 'Career Training' in html[:6000]) else 'ilc_self'
                  prices[kind].append(price)
                  if shown < 25:
                      print('PAGE', kind, int(price), u.split('ed2go.com')[-1][:90])
                      shown += 1
                  time.sleep(0.25)
              for kind, vals in prices.items():
                  if not vals: continue
                  vals.sort()
                  q = statistics.quantiles(vals, n=4) if len(vals) >= 4 else vals
                  print(f'STATS {host} {kind}: n={len(vals)} min={vals[0]:.0f} '
                        f'p25={q[0]:.0f} median={statistics.median(vals):.0f} '
                        f'p75={q[-1]:.0f} max={vals[-1]:.0f}')
                  top = Counter(int(v) for v in vals).most_common(12)
                  print('TOP_PRICE_POINTS', top)
          EOF
