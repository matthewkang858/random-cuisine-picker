# One-off helper: extract Ed2Go course prices with a real headless browser
# (plain HTTP gets 403 from their bot protection). Runs when this file
# changes; results read from the job log.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Browser-crawl Ed2Go prices
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node - <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',
              viewport: { width: 1366, height: 900 }
            });
            const p = await ctx.newPage();

            async function grab(url, label) {
              try {
                const resp = await p.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
                await p.waitForTimeout(4000);
                const status = resp ? resp.status() : '?';
                const title = await p.title();
                console.log(`\n### ${label} | HTTP ${status} | ${title.slice(0, 80)}`);
                if (status === 403 || /access denied|just a moment|attention required/i.test(title)) {
                  console.log('BLOCKED');
                  return;
                }
                // pull course-card-ish text: name + $price pairs from the DOM
                const pairs = await p.evaluate(() => {
                  const out = [];
                  const seen = new Set();
                  const nodes = document.querySelectorAll('a, div, li, article, span');
                  for (const el of nodes) {
                    const t = (el.innerText || '').trim();
                    if (!t || t.length > 220) continue;
                    const m = t.match(/\$\s?([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?)/);
                    if (!m) continue;
                    const key = t.replace(/\s+/g, ' ').slice(0, 120);
                    if (!seen.has(key)) { seen.add(key); out.push(key); }
                    if (out.length > 120) break;
                  }
                  return out;
                });
                pairs.slice(0, 60).forEach(x => console.log('CARD', x.replace(/\n/g, ' · ')));
              } catch (e) {
                console.log(`\n### ${label} FAILED:`, String(e).slice(0, 160));
              }
            }

            await grab('https://www.ed2go.com/courses/', 'fundamentals category index');
            await grab('https://www.ed2go.com/courses/computer-applications/', 'fundamentals: computer applications');
            await grab('https://www.ed2go.com/courses/business/', 'fundamentals: business');
            await grab('https://careertraining.ed2go.com/', 'career training home');
            await grab('https://careertraining.ed2go.com/programs/', 'career training programs');
            await grab('https://www.ed2go.com/courses/health-and-fitness/medical/ctp/medical-billing-coding-voucher-included', 'known CTP page (medical billing)');
            await b.close();
          })();
          EOF
