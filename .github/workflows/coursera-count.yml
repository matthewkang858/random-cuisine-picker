# One-off helper: probe Coursera's pricing surfaces — productPrices API
# patterns for courses/specializations, MasterTrack + certificate page
# tuition, Plus/ProfCert page price text. Push probe JSON back.
# Runs when this file changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Probe Coursera pricing surfaces
        run: |
          python3 - <<'EOF'
          import json, re, time, urllib.request

          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'}

          def get(url, tries=2):
              for a in range(tries):
                  try:
                      return urllib.request.urlopen(
                          urllib.request.Request(url, headers=UA), timeout=45).read().decode('utf-8', 'ignore')
                  except Exception as e:
                      err = e; time.sleep(1)
              return 'ERROR ' + repr(err)[:160]

          probe = {}

          # sample course + s12n ids
          d = json.loads(get('https://api.coursera.org/api/courses.v1?limit=25&fields=s12nIds,slug'))
          courses = d.get('elements', [])
          cids = [c['id'] for c in courses][:6]
          sids = [s for c in courses for s in (c.get('s12nIds') or [])][:6]
          probe['sample_courses'] = [{'id': c['id'], 'slug': c['slug'],
                                      's12nIds': c.get('s12nIds')} for c in courses[:8]]
          print('course ids:', cids, '\ns12n ids:', sids)

          # price API patterns
          patterns = []
          for cid in cids[:3]:
              patterns += [
                  f'https://www.coursera.org/api/productPrices.v3/VerifiedCertificate~{cid}~USD~US',
                  f'https://api.coursera.org/api/productPrices.v3/VerifiedCertificate~{cid}~USD~US',
                  f'https://www.coursera.org/api/productPrices.v4/VerifiedCertificate~{cid}~USD~US',
              ]
          for sid in sids[:3]:
              patterns += [
                  f'https://www.coursera.org/api/productPrices.v3/SpecializationSubscription~{sid}~USD~US',
                  f'https://api.coursera.org/api/productPrices.v3/SpecializationSubscription~{sid}~USD~US',
              ]
          patterns += [
              'https://www.coursera.org/api/productPrices.v3/CourseraPlusSubscription~USD~US',
              'https://www.coursera.org/api/productPrices.v3?q=bulk',
          ]
          probe['api'] = []
          for u in patterns:
              body = get(u)
              probe['api'].append({'url': u, 'body': body[:400]})
              print('\nAPI', u[:110], '\n  ->', body[:200].replace('\n', ' '))
              time.sleep(0.3)

          # MasterTrack + certificates pages
          def page_prices(u):
              html = get(u)
              if html.startswith('ERROR'):
                  return {'url': u, 'error': html[:120]}
              text = re.sub(r'<[^>]+>', ' ', html)
              lines = []
              for m in re.finditer(r'[^.]{0,70}(?:tuition|price|cost|fee|total|USD|per month|/month|monthly)[^.]{0,70}', text, re.I):
                  t = ' '.join(m.group(0).split())
                  if re.search(r'\$\s?\d', t):
                      lines.append(t[:150])
              dollars = re.findall(r'\$\s?([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?)', html)
              title = (re.search(r'<title>([^<]*)</title>', html) or [None, ''])[1]
              return {'url': u, 'title': title.strip()[:100],
                      'lines': list(dict.fromkeys(lines))[:6],
                      'dollars': list(dict.fromkeys(dollars))[:10]}

          for name, sm in [('mastertrack', 'https://www.coursera.org/sitemap~www~mastertrack.xml'),
                           ('certificates', 'https://www.coursera.org/sitemap~www~certificates.xml')]:
              xml = get(sm)
              urls = re.findall(r'<loc>\s*([^<\s]+)\s*</loc>', xml)
              grad = [u for u in urls if '/professional-certificates/' not in u]
              print(f'\n{name}: {len(urls)} urls, {len(grad)} non-profcert')
              probe[name] = []
              for u in grad[:60]:
                  probe[name].append(page_prices(u))
                  time.sleep(0.3)

          # a few product pages for subscription price text
          probe['product_pages'] = []
          for u in ['https://www.coursera.org/courseraplus',
                    'https://www.coursera.org/professional-certificates/google-data-analytics',
                    'https://www.coursera.org/specializations/deep-learning']:
              probe['product_pages'].append(page_prices(u))
              time.sleep(0.3)

          json.dump(probe, open('research/coursera-price-probe.json', 'w'), indent=1)
          print('\nWROTE research/coursera-price-probe.json')
          EOF
      - name: Push results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/coursera-price-probe.json
          git commit -m "Add Coursera pricing probe results" || echo "no changes"
          git push
