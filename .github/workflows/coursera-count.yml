# One-off helper: scrape the premium FutureLearn courses missing from the
# sitemap crawl, rebuild the premium workbook, recalculate it, push back.
# Runs when this file changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Scrape premium courses missing from crawl
        run: |
          python3 - <<'EOF'
          import json, re, time, urllib.request

          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'}
          slugs = set(json.load(open('research/futurelearn-premium-slugs.json')))
          have = {r['url'].rsplit('/', 1)[1] for r in json.load(open('research/futurelearn-crawl.json'))}
          todo = sorted(slugs - have)
          print('scraping', len(todo), 'premium pages missing from sitemap crawl')

          def scrape(slug):
              u = f'https://www.futurelearn.com/courses/{slug}'
              try:
                  html = urllib.request.urlopen(
                      urllib.request.Request(u, headers=UA), timeout=60).read().decode('utf-8', 'ignore')
              except Exception as e:
                  print('FAIL', slug, repr(e))
                  return None
              title = (re.search(r'<title>([^<]*)</title>', html) or [None, ''])[1]
              src_prices = re.findall(r'"(?:price|amount|upgrade_price|currentPrice|value)[^"]{0,20}"\s*:\s*"?[\$£]?\s?([0-9][0-9,]{0,6}(?:\.[0-9]{1,2})?)"?', html, re.I)
              dollars = re.findall(r'\$\s?([0-9]{1,4}(?:\.[0-9]{2})?)', html)
              weeks = (re.search(r'(\d+)\s+weeks?', html, re.I) or [None, None])[1]
              return {'url': u, 'title': title.strip()[:120], 'weeks': weeks,
                      'keyLines': [], 'srcPrices': list(dict.fromkeys(src_prices))[:8],
                      'dollars': list(dict.fromkeys(dollars))[:10], 'pounds': []}

          out = []
          for i, s in enumerate(todo):
              r = scrape(s)
              if r: out.append(r)
              time.sleep(0.3)
          json.dump(out, open('research/futurelearn-premium-extra.json', 'w'), indent=1)
          got = sum(1 for r in out if r['dollars'])
          print('WROTE research/futurelearn-premium-extra.json:', len(out), 'pages,', got, 'with prices')
          EOF
      - name: Rebuild and recalculate premium workbook
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libreoffice-calc python3-openpyxl >/dev/null
          python3 tools/build_premium_sheet.py
          python3 tools/recalc.py research/futurelearn-premium-prices.xlsx 180
      - name: Push results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/futurelearn-premium-extra.json research/futurelearn-premium-prices.xlsx
          git commit -m "Scrape missing premium courses; rebuild premium workbook" || echo "no changes"
          git push
