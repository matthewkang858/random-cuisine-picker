# One-off helper: (1) crawl getsmarter.com product pages for executive-
# education program fees (edX exec-ed pages hide pricing behind
# registration); (2) crawl futurelearn.com course pages for a-la-carte
# upgrade prices. Push both JSONs back. Runs when this file changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Crawl GetSmarter program fees
        run: |
          python3 - <<'EOF'
          import gzip, json, re, time
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor

          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'}

          def fetch(url, tries=3):
              for a in range(tries):
                  try:
                      raw = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
                      if raw[:2] == b'\x1f\x8b':
                          raw = gzip.decompress(raw)
                      return raw.decode('utf-8', 'ignore')
                  except Exception as e:
                      err = e; time.sleep(1 + a)
              print('FETCH_FAIL', url[:110], repr(err))
              return ''

          def locs(xml):
              return re.findall(r'<loc>\s*([^<\s]+)\s*</loc>', xml)

          robots = fetch('https://www.getsmarter.com/robots.txt')
          maps = re.findall(r'(?i)sitemap:\s*(\S+)', robots) or ['https://www.getsmarter.com/sitemap.xml']
          urls, seen, queue = [], set(maps), list(maps)
          while queue:
              m = queue.pop(0)
              xml = fetch(m)
              if '<sitemapindex' in xml:
                  for s in locs(xml):
                      if s not in seen:
                          seen.add(s); queue.append(s)
              else:
                  urls.extend(locs(xml))
          prods = sorted({u for u in urls if '/products/' in u})
          print('getsmarter product urls:', len(prods), '(of', len(urls), 'total)')

          def scrape(u):
              html = fetch(u, tries=2)
              if not html:
                  return None
              title = (re.search(r'<title>([^<]*)</title>', html) or [None, ''])[1]
              fee_lines = []
              text = re.sub(r'<[^>]+>', ' ', html)
              for m in re.finditer(r'[^.]{0,80}(?:fee|price|cost|payment)[^.]{0,80}', text, re.I):
                  t = ' '.join(m.group(0).split())
                  if re.search(r'[\$£R]\s?\d|USD\s?\d', t):
                      fee_lines.append(t[:160])
              src_prices = re.findall(r'"(?:price|amount|fee|programFee|program_fee|totalPrice)[^"]{0,20}"\s*:\s*"?\$?\s?([0-9][0-9,]{2,}(?:\.[0-9]{1,2})?)"?', html, re.I)
              dollars = re.findall(r'\$\s?([0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?)', html)
              weeks = (re.search(r'(\d+)\s+weeks', html, re.I) or [None, None])[1]
              return {'url': u, 'title': title.strip()[:120], 'weeks': weeks,
                      'feeLines': list(dict.fromkeys(fee_lines))[:6],
                      'srcPrices': list(dict.fromkeys(src_prices))[:8],
                      'amounts': list(dict.fromkeys(dollars))[:10]}

          out = []
          with ThreadPoolExecutor(max_workers=6) as ex:
              for i, r in enumerate(ex.map(scrape, prods[:400])):
                  if r: out.append(r)
                  if (i + 1) % 40 == 0: print('scraped', i + 1)
          json.dump(out, open('research/getsmarter-crawl.json', 'w'), indent=1)
          got = sum(1 for r in out if r['feeLines'] or r['srcPrices'])
          print('WROTE research/getsmarter-crawl.json:', len(out), 'pages,', got, 'with fee data')
          EOF

      - name: Crawl FutureLearn course prices
        run: |
          python3 - <<'EOF'
          import gzip, json, re, time
          import urllib.request
          from concurrent.futures import ThreadPoolExecutor

          UA = {'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36'}

          def fetch(url, tries=3):
              for a in range(tries):
                  try:
                      raw = urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60).read()
                      if raw[:2] == b'\x1f\x8b':
                          raw = gzip.decompress(raw)
                      return raw.decode('utf-8', 'ignore')
                  except Exception as e:
                      err = e; time.sleep(1 + a)
              print('FETCH_FAIL', url[:110], repr(err))
              return ''

          def locs(xml):
              return re.findall(r'<loc>\s*([^<\s]+)\s*</loc>', xml)

          robots = fetch('https://www.futurelearn.com/robots.txt')
          maps = re.findall(r'(?i)sitemap:\s*(\S+)', robots) or ['https://www.futurelearn.com/sitemap.xml']
          urls, seen, queue = [], set(maps), list(maps)
          while queue:
              m = queue.pop(0)
              xml = fetch(m)
              if '<sitemapindex' in xml:
                  for s in locs(xml):
                      if s not in seen:
                          seen.add(s); queue.append(s)
              else:
                  urls.extend(locs(xml))
          courses = sorted({re.sub(r'/courses/([^/?#]+).*', r'/courses/\1', u)
                            for u in urls if re.search(r'futurelearn\.com/courses/[^/?#]+', u)})
          print('futurelearn course urls:', len(courses), '(of', len(urls), 'total sitemap urls)')

          def scrape(u):
              html = fetch(u, tries=2)
              if not html:
                  return None
              title = (re.search(r'<title>([^<]*)</title>', html) or [None, ''])[1]
              text = re.sub(r'<[^>]+>', ' ', html)
              key_lines = []
              for m in re.finditer(r'[^.]{0,80}(?:upgrade|buy|one-off|unlimited|price|cost)[^.]{0,80}', text, re.I):
                  t = ' '.join(m.group(0).split())
                  if re.search(r'[\$£]\s?\d', t):
                      key_lines.append(t[:160])
              src_prices = re.findall(r'"(?:price|amount|upgrade_price|currentPrice|value)[^"]{0,20}"\s*:\s*"?[\$£]?\s?([0-9][0-9,]{0,6}(?:\.[0-9]{1,2})?)"?', html, re.I)
              dollars = re.findall(r'\$\s?([0-9]{1,4}(?:\.[0-9]{2})?)', html)
              pounds = re.findall(r'£\s?([0-9]{1,4}(?:\.[0-9]{2})?)', html)
              weeks = (re.search(r'(\d+)\s+weeks?', html, re.I) or [None, None])[1]
              return {'url': u, 'title': title.strip()[:120], 'weeks': weeks,
                      'keyLines': list(dict.fromkeys(key_lines))[:6],
                      'srcPrices': list(dict.fromkeys(src_prices))[:8],
                      'dollars': list(dict.fromkeys(dollars))[:10],
                      'pounds': list(dict.fromkeys(pounds))[:10]}

          out = []
          with ThreadPoolExecutor(max_workers=6) as ex:
              for i, r in enumerate(ex.map(scrape, courses)):
                  if r: out.append(r)
                  if (i + 1) % 100 == 0: print('scraped', i + 1, 'of', len(courses))
          json.dump(out, open('research/futurelearn-crawl.json', 'w'), indent=1)
          got = sum(1 for r in out if r['dollars'] or r['pounds'])
          print('WROTE research/futurelearn-crawl.json:', len(out), 'pages,', got, 'with price data')
          EOF

      - name: Push results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/getsmarter-crawl.json research/futurelearn-crawl.json
          git stash --include-untracked || true
          git pull --rebase origin claude/something-cool-rcnfvm
          git stash pop || true
          git add research/getsmarter-crawl.json research/futurelearn-crawl.json
          git commit -m "Add GetSmarter and FutureLearn crawl results" || echo "no changes"
          git push
