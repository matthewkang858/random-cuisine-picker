# One-off helper: crawl every edX professional-certificate program page for
# prices/discounts and push the raw results back to this branch as JSON.
# Runs when this file changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Crawl edX professional certificates
        run: |
          npm init -y >/dev/null 2>&1
          npm i playwright >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          node - <<'EOF'
          const fs = require('fs');
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36',
              viewport: { width: 1366, height: 900 }
            });
            const p = await ctx.newPage();
            async function goContent(url, wait = 1200) {
              const resp = await p.goto(url, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await p.waitForTimeout(wait);
              return resp ? resp.status() : 0;
            }

            // discover program URLs from the sitemap
            let urls = new Set();
            await goContent('https://www.edx.org/sitemap.xml');
            let content = await p.content();
            const subs = [...content.matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/g)].map(m => m[1]);
            const isIndex = content.includes('<sitemapindex');
            subs.filter(u => u.includes('/professional-certificate/')).forEach(u => urls.add(u));
            if (isIndex) {
              for (const s of subs) {
                try {
                  await goContent(s, 600);
                  content = await p.content();
                  [...content.matchAll(/<loc>\s*([^<\s]+)\s*<\/loc>/g)]
                    .map(m => m[1]).filter(u => u.includes('/professional-certificate/'))
                    .forEach(u => urls.add(u));
                } catch (e) {}
              }
            }
            urls = [...urls].filter(u => !/\/professional-certificate\/?$/.test(u));
            console.log('PROCERT_URLS_FOUND =', urls.length);
            const CAP = 400;
            if (urls.length > CAP) console.log(`capping crawl at ${CAP} of ${urls.length}`);

            const out = [];
            let done = 0;
            for (const u of urls.slice(0, CAP)) {
              try {
                const status = await goContent(u, 2200);
                if (status >= 400) { console.log('ERR', status, u); continue; }
                const data = await p.evaluate(() => {
                  const r = { ld: [], amounts: [], nCourses: null, title: document.title };
                  document.querySelectorAll('script[type="application/ld+json"]').forEach(s => {
                    try {
                      JSON.stringify(JSON.parse(s.textContent))
                        .replace(/"price"\s*:\s*"?([0-9.]+)/g, (_, v) => { r.ld.push(+v); return _; });
                    } catch (e) {}
                  });
                  const txt = document.body.innerText;
                  const mC = txt.match(/(\d+)\s+(?:high-quality\s+|skill-building\s+)?courses?\s+in\s+this/i)
                          || txt.match(/Courses in this program[\s\S]{0,40}?(\d+)/i);
                  if (mC) r.nCourses = +mC[1];
                  r.amounts = [...new Set((txt.match(/\$\s?[0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?/g) || [])
                    .map(a => +a.replace(/[$,\s]/g, '')))].slice(0, 10);
                  return r;
                });
                out.push({ slug: u.split('/professional-certificate/')[1], ...data });
                if (++done % 25 === 0) console.log('crawled', done);
              } catch (e) { console.log('FAIL', u, String(e).slice(0, 80)); }
            }
            fs.mkdirSync('research', { recursive: true });
            fs.writeFileSync('research/edx-procert-crawl.json', JSON.stringify(out, null, 1));
            console.log('WROTE research/edx-procert-crawl.json with', out.length, 'programs');
            await b.close();
          })();
          EOF
      - name: Push crawl results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/edx-procert-crawl.json
          git commit -m "Add edX professional-certificate crawl results" || echo "no changes"
          git push
