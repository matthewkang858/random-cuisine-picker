# One-off helper: recalculate the Coursera multi-tab price workbook with
# LibreOffice and push it back. Runs when this file changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Recalculate workbook
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libreoffice-calc python3-openpyxl >/dev/null
          python3 tools/recalc.py research/coursera-prices.xlsx 420
      - name: Push results back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/coursera-prices.xlsx
          git commit -m "Recalculate Coursera price workbook" || echo "no changes"
          git push
