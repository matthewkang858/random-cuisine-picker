# One-off helper: recalculate research/edx-xseries-prices.xlsx with
# LibreOffice (not installed in the dev container) and push the
# recalculated file back to this branch. Runs when this file changes.
name: Count Coursera catalog
on:
  push:
    branches: [claude/something-cool-rcnfvm]
    paths: ['.github/workflows/coursera-count.yml']

permissions:
  contents: write

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LibreOffice Calc and openpyxl
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libreoffice-calc python3-openpyxl >/dev/null
      - name: Recalculate workbook
        run: |
          python3 tools/recalc.py research/edx-xseries-prices.xlsx 120
      - name: Push recalculated file back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research/edx-xseries-prices.xlsx
          git commit -m "Recalculate XSeries workbook formulas via LibreOffice" || echo "no changes"
          git push
